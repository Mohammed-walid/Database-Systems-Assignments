<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 4 - Auth Portal</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');

        * {
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #fff;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px;
            width: 400px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
        }

        .tab-container {
            display: flex;
            justify-content: space-between;
            margin-bottom: 30px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
        }

        .tab {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.5);
            font-size: 18px;
            font-weight: 600;
            padding: 10px 20px;
            cursor: pointer;
            transition: 0.3s;
            width: 50%;
        }

        .tab.active {
            color: #00f2fe;
            border-bottom: 2px solid #00f2fe;
        }

        .tab:hover {
            color: #fff;
        }

        .form-section {
            display: none;
            animation: fadeIn 0.4s ease-in-out;
        }

        .form-section.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .input-group {
            margin-bottom: 25px;
            position: relative;
        }

        .input-group input {
            width: 100%;
            padding: 10px 0;
            background: transparent;
            border: none;
            border-bottom: 2px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }

        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .input-group input:focus {
            border-bottom-color: #00f2fe;
        }

        .submit-btn {
            width: 100%;
            background: linear-gradient(45deg, #4facfe 0%, #00f2fe 100%);
            color: #fff;
            border: none;
            border-radius: 30px;
            padding: 15px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 242, 254, 0.4);
        }

        .alert-box {
            background: rgba(255, 75, 75, 0.1);
            color: #ff4b4b;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            text-align: center;
            border: 1px solid rgba(255, 75, 75, 0.3);
            display: none;
        }
    </style>
</head>
<body>

    <div class="glass-card">
        <!-- Tabs -->
        <div class="tab-container">
            <button class="tab active" onclick="switchTab('login')">Sign In</button>
            <button class="tab" onclick="switchTab('register')">Sign Up</button>
        </div>

        <!-- Login Form -->
        <div id="login-section" class="form-section active">
            <div id="login-error" class="alert-box"></div>
            <form id="login-form">
                <div class="input-group">
                    <input type="text" id="login-email" placeholder="Email Address">
                </div>
                <div class="input-group">
                    <input type="password" id="login-password" placeholder="Password">
                </div>
                <button type="submit" class="submit-btn">Login</button>
            </form>
        </div>

        <!-- Registration Form -->
        <div id="register-section" class="form-section">
            <div id="reg-error" class="alert-box"></div>
            <form id="register-form">
                <div class="input-group">
                    <input type="text" id="reg-name" placeholder="Full Name">
                </div>
                <div class="input-group">
                    <input type="text" id="reg-email" placeholder="Email Address">
                </div>
                <div class="input-group">
                    <input type="password" id="reg-password" placeholder="Password">
                </div>
                <div class="input-group">
                    <input type="password" id="reg-confirm" placeholder="Confirm Password">
                </div>
                <button type="submit" class="submit-btn">Create Account</button>
            </form>
        </div>
    </div>

    <script>
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        // UI Logic for Tabs
        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.form-section').forEach(f => f.classList.remove('active'));
            hideErrors();

            if(tabName === 'login') {
                document.querySelectorAll('.tab')[0].classList.add('active');
                document.getElementById('login-section').classList.add('active');
            } else {
                document.querySelectorAll('.tab')[1].classList.add('active');
                document.getElementById('register-section').classList.add('active');
            }
        }

        // Validation & Error Display
        function showError(elementId, message) {
            const errorDiv = document.getElementById(elementId);
            errorDiv.innerText = message;
            errorDiv.style.display = 'block';
        }

        function hideErrors() {
            document.getElementById('login-error').style.display = 'none';
            document.getElementById('reg-error').style.display = 'none';
        }

        // Login Submission
        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            hideErrors();

            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;

            if (!email) return showError('login-error', "Email field is empty");
            if (!password) return showError('login-error', "Password field is empty");

            const formData = new FormData();
            formData.append('email', email);
            formData.append('password', password);

            fetch('/login', { method: 'POST', body: formData })
                .then(res => res.json())
                .then(data => {
                    if (data.status === 'success') window.location.href = '/welcome';
                    else showError('login-error', data.message);
                });
        });

        // Registration Submission
        document.getElementById('register-form').addEventListener('submit', function(e) {
            e.preventDefault();
            hideErrors();

            const name = document.getElementById('reg-name').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const password = document.getElementById('reg-password').value;
            const confirm = document.getElementById('reg-confirm').value;

            if (!name) return showError('reg-error', "Name field is empty");
            if (!email) return showError('reg-error', "Email field is empty");
            if (!password) return showError('reg-error', "Password field is empty");
            if (!confirm) return showError('reg-error', "Confirm password field is empty");

            if (!emailRegex.test(email)) return showError('reg-error', "Email has an invalid format");
            if (password !== confirm) return showError('reg-error', "Password and confirm password must be the same");

            const formData = new FormData();
            formData.append('name', name);
            formData.append('email', email);
            formData.append('password', password);

            fetch('/register', { method: 'POST', body: formData })
                .then(res => res.json())
                .then(data => {
                    if (data.status === 'success') window.location.href = '/welcome';
                    else showError('reg-error', data.message);
                });
        });
    </script>
</body>
</html>
